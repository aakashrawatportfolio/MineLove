<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Chhaya ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top left,#ffb3d9,transparent 30%),
    radial-gradient(circle at bottom right,#ffd6a5,transparent 30%),
    linear-gradient(135deg,#ff4f9a,#ff758c,#fbc2eb);
}

/* Floating Hearts */
.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.hearts span{
    position:absolute;
    bottom:-100px;
    color:rgba(255,255,255,.7);
    font-size:25px;
    animation:float 10s linear infinite;
}

.hearts span:nth-child(1){left:10%;animation-delay:0s;}
.hearts span:nth-child(2){left:25%;animation-delay:2s;}
.hearts span:nth-child(3){left:40%;animation-delay:4s;}
.hearts span:nth-child(4){left:60%;animation-delay:1s;}
.hearts span:nth-child(5){left:75%;animation-delay:5s;}
.hearts span:nth-child(6){left:90%;animation-delay:3s;}

@keyframes float{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

/* Gift Button */

.surprise-btn{
    position:relative;
    width:220px;
    height:220px;
    border-radius:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.4);
    box-shadow:0 25px 80px rgba(0,0,0,.25);
    transition:.4s ease;
    animation:bounce 2.5s infinite;
}

.surprise-btn:hover{
    transform:scale(1.08);
    box-shadow:0 35px 100px rgba(0,0,0,.35);
}

.gift{
    font-size:90px;
    margin-bottom:10px;
}

.text{
    color:white;
    font-size:18px;
    font-weight:700;
    letter-spacing:1px;
}

.sub{
    color:white;
    opacity:.85;
    font-size:13px;
    margin-top:5px;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-15px);
    }
}

.glow{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    filter:blur(90px);
    z-index:-1;
}

</style>
</head>
<body>

<div class="hearts">
    <span>❤️</span>
    <span>💕</span>
    <span>💖</span>
    <span>💗</span>
    <span>💘</span>
    <span>❤️</span>
</div>

<div class="glow"></div>

<!-- Change birthday-chhaya.html to your birthday page filename -->

<a href="bday.html" class="surprise-btn">
    <div class="gift">🎁</div>
    <div class="text">Open Me</div>
    <div class="sub">A Special Surprise Awaits ❤️</div>
</a>

</body>
</html>
